<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Aapka naya Website aur App naam -->
    <title>Pw rathor</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Target Website set kar di gayi hai -->
    <iframe id="webMirror" src="https://stream.testuk.org/"></iframe>

    <script>
        const iframe = document.getElementById('webMirror');

        iframe.onload = function() {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;

                // 1. BRAND TEXT REBRANDING (Har 1.5 second me text badlega)
                setInterval(() => {
                    let bodyText = doc.body.innerHTML;
                    
                    // Purane website ke naam (vedstudy) ko "Pw rathor" se badalna
                    if (bodyText.includes("vedstudy") || bodyText.includes("Vedstudy")) {
                        doc.body.innerHTML = bodyText.replace(/vedstudy/gi, "Pw rathor");
                    }
                }, 1500);

                // 2. LOGO REBRAND CODE (Aapka Google Photos wala logo lagane ke liye)
                setInterval(() => {
                    // Target site ke navbar aur header ke images ko check karna
                    let logos = doc.querySelectorAll('img, .logo, .navbar-brand img');
                    logos.forEach(logo => {
                        // Agar koi bhi image logo ki tarah use ho rahi hai to use aapke logo se badal dega
                        if (logo.src.includes('logo') || logo.className.includes('logo') || logo.alt.includes('logo')) {
                            logo.src = "https://googleusercontent.com"; 
                            // Note: Agar image load na ho, toh aap upar diye URL ki jagah apna logo Postimages.org par upload karke direct link yahan daal sakte hain.
                        }
                    });
                }, 1000);

            } catch (error) {
                console.log("Mirror mode running. Security check bypass active.");
            }
        };
    </script>
</body>
</html>
